<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Report — レポート集</title><style>:root{color-scheme:dark;--bg:#0c1220;--panel:#172235;--text:#eaf1fb;--muted:#a8bbd0;--accent:#66d9bc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.8 system-ui,-apple-system,sans-serif}main{max-width:920px;margin:auto;padding:54px 22px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.2}p,li{color:var(--muted)}a{color:var(--accent)}.card{display:block;background:var(--panel);padding:24px;border:1px solid #304359;border-radius:17px;margin:15px 0;text-decoration:none}.card:hover{border-color:var(--accent)}.tag{font-size:.85rem;color:var(--accent)}.lead{font-size:1.2rem}footer{margin-top:60px;color:var(--muted);font-size:.85rem}</style></head><body><main><header><div class="tag">MY REPORT</div><h1>My Report</h1><p class="lead">技術に限らず、調べたことや考察をテーマごとにまとめるレポート集。</p></header><h2>カテゴリ</h2><section id="categories"><p>読み込み中…</p></section><footer><a href="https://github.com/Futa0104/my-report">GitHub Repository</a></footer></main><script>fetch('./reports.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const e=document.getElementById('categories');e.replaceChildren();for(const c of d.categories||[]){const a=document.createElement('a');a.className='card';a.href=c.path;const h=document.createElement('h2');h.textContent=c.title;const p=document.createElement('p');p.textContent=c.description;const n=document.createElement('span');n.className='tag';n.textContent=(d.reports||[]).filter(x=>x.category===c.id).length+' reports';a.append(h,p,n);e.append(a)}}).catch(()=>document.getElementById('categories').textContent='カテゴリ一覧を取得できませんでした。');</script></body></html>
