<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Report — 技術レポート</title><style>:root{color-scheme:dark;--bg:#0c1220;--panel:#172235;--text:#eaf1fb;--muted:#a8bbd0;--accent:#66d9bc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.8 system-ui,-apple-system,sans-serif}main{max-width:920px;margin:auto;padding:54px 22px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.2}h2{margin-top:38px}p,li{color:var(--muted)}a{color:var(--accent)}.card{background:var(--panel);padding:24px;border:1px solid #304359;border-radius:17px;margin:15px 0}.tag{font-size:.85rem;color:var(--accent)}.hero{margin-bottom:36px}.lead{font-size:1.2rem}.diagram{display:grid;gap:12px;max-width:520px;margin:25px auto;text-align:center}.diagram div{border:1px solid #47738a;border-radius:12px;padding:14px;background:#19314a}.diagram div:nth-child(3){border-color:var(--accent);background:#19493f}code{background:#22354b;padding:2px 6px;border-radius:5px}pre{overflow:auto;background:#08101d;padding:20px;border-radius:12px}footer{margin-top:60px;color:var(--muted);font-size:.85rem}</style><main><header class="hero"><div class="tag">MY REPORT / TECH NOTES</div><h1>技術を知り、実装を読む。</h1><p class="lead">OSSの仕組み、設計、使いどころを一つずつ掘り下げるノート。</p></header><h2>公開レポート</h2><section id="reports"><p>読み込み中…</p></section><footer>My Report · <a href="https://github.com/Futa0104/my-report">GitHub Repository</a></footer></main><script>fetch('./reports.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{let e=document.getElementById('reports');e.replaceChildren();for(const x of d.reports){let c=document.createElement('article');c.className='card';let s=document.createElement('div');s.className='tag';s.textContent=x.category+' · '+x.date;let h=document.createElement('h2');let a=document.createElement('a');a.href=x.path;a.textContent=x.title;h.append(a);let p=document.createElement('p');p.textContent=x.description;c.append(s,h,p);e.append(c)}}).catch(()=>document.getElementById('reports').textContent='レポート一覧を取得できませんでした。');</script></html>
